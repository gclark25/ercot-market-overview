name: Daily ERCOT Market Overview

on:
  schedule:
    # 07:15 CT — same cadence as hen-morning-report. CT is UTC-5 (CDT) or UTC-6 (CST);
    # this is set for CDT (summer). Adjust by 1 hour for CST months, or switch to two
    # cron entries if you want it to self-correct across the DST boundary.
    - cron: "15 12 * * *"
  workflow_dispatch: {}   # manual trigger for testing

jobs:
  discover-configs:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: List customer configs (excluding template)
        run: |
          cd configs
          json=$(ls *.yaml | grep -v '^_template.yaml$' | jq -R -s -c 'split("\n")[:-1]')
          echo "configs=$json" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: discover-configs
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated node backfill data
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover-configs.outputs.configs) }}
      fail-fast: false   # one customer's build failing shouldn't block the others
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report for ${{ matrix.config }}
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_SUBSCRIPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build_report.py --config "configs/${{ matrix.config }}"

      - name: Top up already-tracked node data
        # dashboard/data/nodes/*.json accumulate from on-demand searches (see
        # node-backfill.yml + functions/node-lookup.js). This just fetches
        # each tracked node's missing day(s) and appends — same script,
        # already-idempotent, so a node with nothing new to add is a no-op.
        #
        # Note: dashboard/data/nodes/ isn't namespaced per customer config,
        # so with more than one config this would have every matrix job
        # updating (and trying to commit) the same shared files — fine at
        # today's single-config scale, worth revisiting before a 2nd
        # customer onboards.
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_SUBSCRIPTION_KEY }}
        run: |
          if [ -d dashboard/data/nodes ] && [ -n "$(ls -A dashboard/data/nodes 2>/dev/null)" ]; then
            for f in dashboard/data/nodes/*.json; do
              node=$(basename "$f" .json)
              echo "--- Updating tracked node: $node ---"
              python pipeline/backfill_node.py --node "$node" --config "configs/${{ matrix.config }}" || echo "WARN: update failed for $node, continuing"
            done
          else
            echo "No tracked nodes yet — nothing to update"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # projectName is read out of the config by build_report.py and written to
          # this file so the matrix doesn't need a second YAML parse step here.
          projectName: ${{ env.CF_PROJECT_NAME }}
          directory: dashboard

      - name: Commit updated node data
        # Runs after deploy so a slow/failed git operation never delays getting
        # fresh data live. latest.json itself stays gitignored/ephemeral as
        # before — only the accumulating per-node files get committed.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/nodes/
          if git diff --staged --quiet; then
            echo "No node updates to commit"
          else
            git commit -m "Update tracked node data"
            git pull --rebase --autostash
            git push
          fi
