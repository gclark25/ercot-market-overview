<!DOCTYPE html>
<!--
  Structural scaffold only — tab wiring and data-loading plumbing, no real
  visual design yet. That's a separate pass (see README "Build order").
  Kept deliberately plain so it's obvious this isn't the final look.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERCOT Market Overview</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="product-name">ERCOT Market Overview</h1>
    <span id="report-date" class="report-date"></span>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview">Rolling 3-Day Overview</button>
    <button class="tab-btn" data-tab="prices">Prices &amp; AS</button>
    <button class="tab-btn" data-tab="intelligence">Intelligence</button>
  </nav>

  <main>
    <section id="tab-overview" class="tab-panel active">
      <h2>Net Load — 3-Day History / 5-Day Forecast</h2>
      <canvas id="netLoadChart"></canvas>

      <h2>Hub DA/RT Performance</h2>
      <table id="hubWindowsTable">
        <thead>
          <tr>
            <th>Hub</th>
            <th>Window</th>
            <th>Avg DA</th>
            <th>Avg RT</th>
            <th>DART Spread</th>
            <th>RT Volatility</th>
          </tr>
        </thead>
        <tbody><!-- populated by app.js from data/latest.json --></tbody>
      </table>
    </section>

    <section id="tab-prices" class="tab-panel">
      <div class="node-search">
        <input type="text" id="nodeSearchInput" placeholder="Search any ERCOT node…" />
        <button id="nodeSearchBtn">Search</button>
        <span id="nodeSearchStatus"></span>
      </div>

      <h2>Energy DA / RT / DART — HE 1-24</h2>
      <table id="hourlyPriceTable">
        <thead>
          <tr><th>HE</th><th>DA</th><th>RT</th><th>DART</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h2>Ancillary Services DA / RT / DART — HE 1-24</h2>
      <table id="asPriceTable">
        <thead>
          <tr><th>HE</th><th>Service</th><th>DA</th><th>RT</th><th>DART</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-intelligence" class="tab-panel">
      <h2>Market Recap</h2>
      <p id="aiRecapDate" class="report-date"></p>
      <div id="aiRecapText"></div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
